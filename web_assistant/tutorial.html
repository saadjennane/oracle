<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oracle — Tutorial</title>
  <style>
    :root {
      --bg: #000; --surface: #111; --surface2: #1a1a2e;
      --border: #222; --divider: #1a1a1a;
      --text: #fff; --text2: #aaa; --text3: #666;
      --primary: #007AFF; --example: #30D5C8; --warning: #FF9500;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.5; min-height: 100vh;
    }
    .header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .brand span { color: var(--text3); font-weight: 400; letter-spacing: 0; margin-left: 6px; font-size: 13px; }
    .lang-switch { display: flex; gap: 4px; background: var(--surface); border-radius: 8px; padding: 3px; }
    .lang-switch button {
      background: transparent; border: 0; color: var(--text2);
      padding: 6px 10px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    }
    .lang-switch button.active { background: var(--primary); color: #fff; }

    .container { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }

    .toc {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 18px; margin-bottom: 28px;
    }
    .toc-title { font-size: 11px; color: var(--text3); letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
    .toc a {
      display: block; padding: 5px 0; color: var(--primary);
      text-decoration: none; font-size: 13px; font-weight: 500;
    }
    .toc a:hover { opacity: 0.7; }

    .section { margin-bottom: 36px; padding-top: 8px; }
    .section-title {
      font-size: 19px; font-weight: 700; color: var(--text);
      padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
    }
    .h { font-size: 15px; font-weight: 600; color: var(--text); margin: 18px 0 6px; }
    .p { font-size: 13.5px; color: var(--text2); line-height: 1.6; margin-bottom: 8px; white-space: pre-wrap; }

    .tip {
      margin: 10px 0; padding: 12px 14px; border-radius: 10px;
      font-size: 12.5px; color: var(--text); line-height: 1.55;
      border: 1px solid; white-space: pre-wrap;
    }
    .tip.info     { background: rgba(0,122,255,0.08);  border-color: rgba(0,122,255,0.25);  }
    .tip.example  { background: rgba(48,213,200,0.08); border-color: rgba(48,213,200,0.25); }
    .tip.warning  { background: rgba(255,149,0,0.08);  border-color: rgba(255,149,0,0.25);  }
    .tip-label {
      display: inline-block; font-size: 10px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; margin-right: 8px;
      padding: 2px 6px; border-radius: 4px; vertical-align: 1px;
    }
    .tip.info    .tip-label { background: rgba(0,122,255,0.2);  color: #66b2ff; }
    .tip.example .tip-label { background: rgba(48,213,200,0.2); color: #5fe9dc; }
    .tip.warning .tip-label { background: rgba(255,149,0,0.2);  color: #ffb84d; }

    table { width: 100%; border-collapse: collapse; margin: 10px 0; background: var(--surface); border-radius: 8px; overflow: hidden; }
    th, td { padding: 9px 12px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--divider); vertical-align: top; }
    th { color: var(--text); font-weight: 600; background: var(--surface2); }
    td { color: var(--text2); }
    tr:last-child td { border-bottom: 0; }

    .footer { text-align: center; color: var(--text3); font-size: 12px; padding-top: 20px; }
    .footer a { color: var(--primary); text-decoration: none; }

    @media (min-width: 900px) {
      .container { max-width: 820px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">ORACLE <span id="brandSub">User Guide</span></div>
    <div class="lang-switch">
      <button data-lang="en">EN</button>
      <button data-lang="fr">FR</button>
      <button data-lang="es">ES</button>
    </div>
  </div>

  <div class="container">
    <div class="toc" id="toc"></div>
    <div id="content"></div>
    <div class="footer">
      <p id="footerText"></p>
    </div>
  </div>

  <script>
    const T = (en, fr, es) => ({en, fr, es});
    const t = (obj, lang) => obj[lang] || obj.en;

    const H = (title) => ({kind: 'h', title});
    const P = (text) => ({kind: 'p', text});
    const Tip = (type, text) => ({kind: 'tip', type, text});
    const Table = (rows) => ({kind: 'table', rows});

    const SECTIONS = [
      { id: 'overview', title: T('1. What is Oracle?', '1. Qu\'est-ce qu\'Oracle ?', '1. ¿Qué es Oracle?'), items: [
        P(T(
          'Oracle turns your phone into a mentalism tool. You create prediction presets before the show, then secretly input the spectator\'s choices during performance. The app generates text (or saves an image) that matches their choices perfectly.',
          'Oracle transforme votre téléphone en outil de mentalisme. Vous créez des presets de prédiction avant le show, puis entrez secrètement les choix du spectateur pendant la performance. L\'app génère un texte (ou sauvegarde une image) qui correspond parfaitement.',
          'Oracle convierte tu teléfono en una herramienta de mentalismo. Creas presets de predicción antes del show, luego introduces secretamente las elecciones del espectador. La app genera texto (o guarda una imagen) que coincide perfectamente.')),
        H(T('The 4 Steps', 'Les 4 Étapes', 'Los 4 Pasos')),
        P(T(
          '1. CREATE — Build a preset with narrative templates for every possible outcome\n2. PERFORM — Do your routine, the spectator makes choices freely\n3. INPUT — Secretly enter their choices using stealth input (black screen)\n4. REVEAL — Show the "prediction" that perfectly matches what happened',
          '1. CRÉER — Construisez un preset avec des templates pour chaque résultat possible\n2. PERFORMER — Faites votre routine, le spectateur choisit librement\n3. INPUT — Entrez secrètement ses choix via l\'input stealth (écran noir)\n4. RÉVÉLER — Montrez la "prédiction" qui correspond parfaitement',
          '1. CREAR — Construye un preset con plantillas para cada resultado posible\n2. ACTUAR — Haz tu rutina, el espectador elige libremente\n3. ENTRADA — Introduce secretamente sus elecciones vía input stealth (pantalla negra)\n4. REVELAR — Muestra la "predicción" que coincide perfectamente')),
        Tip('example', T(
          'Example: spectator picks Right, Left, Right across 3 rounds. You open Notes and they read: "You will go Right, then Left, then Right again. I knew it."',
          'Exemple : le spectateur choisit Droite, Gauche, Droite sur 3 rounds. Vous ouvrez Notes et on lit : "Tu vas faire Droite, puis Gauche, puis Droite. Je le savais."',
          'Ejemplo: el espectador elige Derecha, Izquierda, Derecha en 3 rondas. Abres Notas y se lee: "Vas a ir Derecha, luego Izquierda, luego Derecha. Lo sabía."')),
      ]},

      { id: 'presets', title: T('2. Preset Types', '2. Types de Presets', '2. Tipos de Presets'), items: [
        H(T('Choices', 'Choices', 'Choices')),
        P(T(
          'Predict the spectator\'s choices across 1-5 rounds with 2-6 options. Write a narrative template for each Hit/Miss pattern.',
          'Prédisez les choix du spectateur sur 1-5 rounds avec 2-6 options. Écrivez un template narratif pour chaque pattern Hit/Miss.',
          'Predice las elecciones del espectador en 1-5 rondas con 2-6 opciones.')),
        Tip('example', T(
          '"Which Hand?" — Right or Left, 3 rounds.\nTemplate for HMH: "You\'ll go {choiceS1}, then {choiceS2}, then {choiceS3}. I\'ll guess the first and last, but let you win round 2 ;)"',
          '"Quelle Main ?" — Droite ou Gauche, 3 rounds.\nTemplate pour HMH : "Tu vas faire {choiceS1}, puis {choiceS2}, puis {choiceS3}. Je vais deviner le début et la fin, mais te laisser gagner le 2ème ;)"',
          '"¿Qué Mano?" — Derecha o Izquierda, 3 rondas.\nPlantilla para HMH: "Vas a elegir {choiceS1}, luego {choiceS2}, luego {choiceS3}. Adivinaré la primera y última ;)"')),

        H(T('Duel', 'Duel', 'Duel')),
        P(T(
          'Rock/Paper/Scissors prediction. Fixed Rounds (1-5) or First To (2-5 points). S vs P or S vs S.',
          'Prédiction Pierre/Feuille/Ciseaux. Rounds Fixes (1-5) ou Premier À (2-5 points). S vs P ou S vs S.',
          'Predicción Piedra/Papel/Tijeras. Rondas Fijas (1-5) o Primero En (2-5 puntos).')),
        Tip('example', T(
          '3 rounds, score 2-1 for you:\n"We\'ll finish 2-1 for me. I\'ll win when you play {loseChoiceS1} and {loseChoiceS2}. I\'ll let you win one to keep it exciting ;)"',
          '3 rounds, score 2-1 pour vous :\n"On va finir 2-1 pour moi. Je vais gagner quand tu joueras {loseChoiceS1} et {loseChoiceS2}. Je te laisse en gagner un pour le suspense ;)"',
          '3 rondas, marcador 2-1:\n"Terminaremos 2-1 para mí. Ganaré cuando juegues {loseChoiceS1} y {loseChoiceS2}."')),

        H(T('Free Will', 'Free Will', 'Free Will')),
        P(T(
          '3 objects on the table. The spectator takes one, gives one to you, leaves one. 6 possible outcomes. Each outcome has its own pre-written text — no variables needed, the text is complete as-is.',
          '3 objets sur la table. Le spectateur en prend un, vous en donne un, en laisse un. 6 résultats possibles. Chaque résultat a son propre texte pré-écrit — pas de variables, le texte est complet tel quel.',
          '3 objetos en la mesa. 6 resultados posibles. Cada resultado tiene su propio texto pre-escrito.')),
        Tip('example', T(
          'Objects: Key, Box, Coin.\nIf spectator takes Key, gives Box, leaves Coin:\n"You\'ll keep the Key — the one that opens everything. You\'ll give me the Box — because you trust me. The Coin stays — some choices speak for themselves."',
          'Objets : Clé, Boîte, Pièce.\nSi le spectateur prend la Clé, donne la Boîte, laisse la Pièce :\n"Tu vas garder la Clé — celle qui ouvre tout. Tu vas me donner la Boîte — parce que tu me fais confiance. La Pièce reste — certains choix parlent d\'eux-mêmes."',
          'Objetos: Llave, Caja, Moneda.\n"Vas a quedarte con la Llave — la que abre todo. Me darás la Caja. La Moneda se queda."')),
        Tip('info', T(
          'Runtime labels: long-press the black input screen BEFORE starting to swap the 3 object names just for this performance (e.g. you forgot the coin and used a pen). The fake note appears with the 3 names stacked — edit them, then tap the top-right corner (just under the battery) to confirm. Original labels return automatically once the result is revealed.',
          'Labels temporaires : long-press sur l\'écran noir AVANT de commencer pour remplacer les 3 noms d\'objets pour cette prestation seulement (ex. tu as oublié la pièce et utilisé un stylo). La fake note apparaît avec les 3 noms empilés — modifie-les, puis tap en haut à droite (sous l\'icône batterie) pour valider. Les labels d\'origine reviennent dès que le résultat s\'affiche.',
          'Etiquetas en tiempo real: mantén pulsada la pantalla negra ANTES de empezar para sustituir los 3 nombres solo en esta actuación (ej. olvidaste la moneda y usaste un bolígrafo). Aparece la fake note con los 3 nombres apilados — edítalos y toca arriba a la derecha (bajo el icono de batería) para confirmar. Los originales vuelven al revelar el resultado.')),
        Tip('info', T(
          'Bank modes — Free Will offers two ways to write narration:\n• 6 texts: one custom text per permutation. Use ((Label1)), ((Label2)), ((Label3)) to reference the canonical objects. Best when you want detailed, nuanced narration that reacts specifically to each outcome (e.g. a different reasoning for "Phone taken" vs "Coin taken").\n• 1 text: a single template covering all 6 permutations. Use {TAKE}, {GIVE}, {TABLE} which substitute at runtime with whichever object got that action. Faster to set up; less narrative depth.',
          'Modes de banque — Free Will propose deux façons d\'écrire la narration :\n• 6 textes : un texte custom par permutation. Utilise ((Label1)), ((Label2)), ((Label3)) pour référencer les objets canoniques. Idéal quand tu veux une narration détaillée et nuancée qui réagit spécifiquement à chaque sortie (ex. raisonnement différent pour "Téléphone pris" vs "Pièce prise").\n• 1 texte : un seul template qui couvre les 6 permutations. Utilise {TAKE}, {GIVE}, {TABLE} qui se substituent au runtime par l\'objet correspondant à l\'action. Plus rapide à configurer ; moins de profondeur narrative.',
          'Modos de banco — Free Will ofrece dos formas de escribir la narración:\n• 6 textos: un texto personalizado por permutación. Usa ((Label1)), ((Label2)), ((Label3)) para referenciar los objetos canónicos. Ideal cuando quieres una narración detallada y matizada que reacciona específicamente a cada resultado.\n• 1 texto: una plantilla única que cubre las 6 permutaciones. Usa {TAKE}, {GIVE}, {TABLE} que se sustituyen en tiempo de ejecución. Más rápido de configurar; menos profundidad narrativa.')),

        H(T('Multiple Out', 'Multiple Out', 'Multiple Out')),
        P(T(
          'Write 2+ prediction texts. Secretly select the one matching the spectator\'s choice.',
          'Écrivez 2+ textes de prédiction. Sélectionnez secrètement celui qui correspond au choix du spectateur.',
          'Escribe 2+ textos de predicción. Selecciona secretamente el que corresponda.')),
        Tip('example', T(
          'Astrological sign prediction — one text per sign:\n• Aries: "You\'re a fire sign. Bold, impulsive, always first."\n• Taurus: "Earth grounds you. Patient, loyal, unstoppable."\n• Gemini: "Two minds, one soul. You adapt to everything."\n...12 texts total, one for each sign.',
          'Prédiction signe astrologique — un texte par signe :\n• Bélier : "Tu es un signe de feu. Audacieux, impulsif, toujours premier."\n• Taureau : "La terre t\'ancre. Patient, loyal, inarrêtable."\n• Gémeaux : "Deux esprits, une âme. Tu t\'adaptes à tout."\n...12 textes au total.',
          'Predicción de signo zodiacal — un texto por signo:\n• Aries: "Eres signo de fuego. Audaz, impulsivo, siempre primero."\n...12 textos en total.')),

        H(T('Confabulation', 'Confabulation', 'Confabulation')),
        P(T(
          'Multi-slot text template. Each slot has options (Color: red/blue, Animal: cat/dog). Supports API variables.',
          'Template texte multi-slots. Chaque slot a des options (Couleur: rouge/bleu, Animal: chat/chien). Supporte les variables API.',
          'Plantilla multi-slot con opciones. Soporta variables API.')),
        Tip('example', T(
          'Template: "You\'re thinking of a {{Color}} {{Animal}}"\nSlots: Color (red, blue, green) + Animal (cat, dog, bird)\nResult: "You\'re thinking of a blue cat"',
          'Template : "Tu penses à un {{Animal}} {{Couleur}}"\nSlots : Couleur (rouge, bleu, vert) + Animal (chat, chien, oiseau)\nRésultat : "Tu penses à un chat bleu"',
          'Plantilla: "Piensas en un {{Animal}} {{Color}}"\nResultado: "Piensas en un gato azul"')),

        H(T('Number', 'Number', 'Number')),
        P(T(
          '• Rainman — formula (e.g., 12345 - XXXX or XX * XX + X)\n• Birthday — birth date → day of the week + days since\n• Today — date complement',
          '• Rainman — formule (ex: 12345 - XXXX ou XX * XX + X)\n• Anniversaire — date → jour de la semaine + jours depuis\n• Aujourd\'hui — complément de date',
          '• Rainman — fórmula (ej: 12345 - XXXX)\n• Cumpleaños — fecha → día de la semana + días desde\n• Hoy — complemento de fecha')),
        P(T(
          'Number presets have two output screens (chosen in the preset): Notes (same reveal as above) or Calculator (displays the result as if typed on the iOS Calculator). See Output Modes for setup of the Calculator screenshot.',
          'Les presets Number ont deux écrans de sortie (choix dans le preset) : Notes (même révélation qu\'au-dessus) ou Calculatrice (affiche le résultat comme si tapé sur la Calculatrice iOS). Voir Modes de Sortie pour la configuration du screenshot Calculatrice.',
          'Los presets Number tienen dos pantallas de salida: Notas (misma revelación) o Calculadora (muestra el resultado como si fuera tecleado en la Calculadora iOS). Ver Modos de Salida para configurar la captura.')),
      ]},

      { id: 'input', title: T('3. Input Methods', '3. Méthodes d\'Input', '3. Métodos de Entrada'), items: [
        P(T('All methods work on a black screen — the spectator sees nothing.', 'Toutes les méthodes fonctionnent sur écran noir — le spectateur ne voit rien.', 'Todos los métodos funcionan en pantalla negra — el espectador no ve nada.')),

        H(T('Volume Buttons', 'Boutons Volume', 'Botones de Volumen')),
        Table([
          [T('Gesture', 'Geste', 'Gesto'), T('Option', 'Option', 'Opción')],
          [T('UP ×1','UP ×1','UP ×1'), T('1','1','1')],
          [T('DOWN ×1','DOWN ×1','DOWN ×1'), T('2','2','2')],
          [T('UP ×2','UP ×2','UP ×2'), T('3','3','3')],
          [T('DOWN ×2','DOWN ×2','DOWN ×2'), T('4','4','4')],
          [T('UP ×3','UP ×3','UP ×3'), T('5','5','5')],
          [T('DOWN ×3','DOWN ×3','DOWN ×3'), T('6','6','6')],
        ]),
        P(T('Undo: 3 rapid presses same direction. Reset: double undo. Max 6 options.', 'Annuler : 3 pressions rapides même direction. Reset : double annulation. Max 6 options.', 'Deshacer: 3 pulsaciones rápidas misma dirección. Reset: doble deshacer. Máx 6.')),

        H(T('Tap Zones', 'Zones Tap', 'Zonas Tap')),
        P(T('Black screen divided into invisible zones. Max 6 options.', 'Écran noir divisé en zones invisibles. Max 6 options.', 'Pantalla negra dividida en zonas invisibles. Máx 6.')),
        Table([
          [T('Options','Options','Opciones'), T('Layout','Disposition','Diseño')],
          [T('2','2','2'), T('Top / Bottom (or Left / Right)', 'Haut / Bas (ou Gauche / Droite)', 'Arriba / Abajo (o Izq / Der)')],
          [T('3','3','3'), T('3 horizontal bands', '3 bandes horizontales', '3 bandas horizontales')],
          [T('4','4','4'), T('4 corners (or 4 stripes)', '4 coins (ou 4 bandes)', '4 esquinas (o 4 franjas)')],
          [T('5','5','5'), T('2×3 grid (1 disabled)', 'Grille 2×3 (1 désactivée)', 'Cuadrícula 2×3 (1 desactivada)')],
          [T('6','6','6'), T('2×3 grid', 'Grille 2×3', 'Cuadrícula 2×3')],
        ]),

        H(T('Swipe', 'Swipe', 'Swipe')),
        P(T('Configurable swipe patterns. Each option = a gesture sequence (e.g., ↑→). Fully customizable in the builder. 1 gesture for ≤4 options, 2 for ≤16, 4 for more.', 'Patterns de swipe configurables. Chaque option = une séquence de gestes (ex: ↑→). Entièrement personnalisable. 1 geste pour ≤4 options, 2 pour ≤16, 4 pour plus.', 'Patrones de swipe configurables. Cada opción = una secuencia de gestos. Totalmente personalizable.')),

        H(T('Audio AI', 'Audio IA', 'Audio IA')),
        P(T('Speech recognition listens to the conversation. Analyzes context with GPT-4o for maximum accuracy. Optional start/stop trigger sentences. Requires OpenAI API key.', 'Reconnaissance vocale écoute la conversation. Analyse le contexte avec GPT-4o pour une précision maximale. Phrases déclencheur optionnelles. Nécessite clé API OpenAI.', 'Reconocimiento de voz escucha la conversación. Analiza el contexto con GPT-4o para máxima precisión. Requiere clave API OpenAI.')),

        H(T('Assistant Mode (global)', 'Mode Assistant (global)', 'Modo Asistente (global)')),
        P(T(
          'A global toggle on the home screen — orange bar when ON. The webapp at oass.app/{your-id} mirrors any preset you launch (buttons / black screen tap / black screen swipe, depending on Settings → Assistant stealth UI), and falls back to a free-text field whenever no preset is active. Always OFF on app restart.',
          'Un bouton global sur l\'écran d\'accueil — barre orange quand ON. La webapp oass.app/{votre-id} mirroir n\'importe quel preset lancé (boutons / écran noir tap / écran noir swipe, selon Paramètres → Assistant stealth UI), et propose un champ texte libre quand aucun preset n\'est actif. OFF par défaut au lancement de l\'app.',
          'Un toggle global en la pantalla principal — barra naranja en ON. La webapp oass.app/{tu-id} refleja cualquier preset lanzado y muestra un campo de texto libre cuando no hay preset activo. OFF al reiniciar.')),
        H(T('URL shortcut: oass.app/{id}/{command}', 'Raccourci URL : oass.app/{id}/{commande}', 'Atajo URL: oass.app/{id}/{comando}')),
        P(T(
          'Open this URL on any device — no need to interact with buttons. The webapp auto-sends the command. Examples:\n• Multiple Out 6 texts → oass.app/abc/4 selects the 4th text\n• Choices 3 rounds (preprogrammed) → oass.app/abc/121 sends spectator picks 1,2,1\n• Confab with ((ACROSTIC_URL)) → oass.app/abc/Paris sends "Paris" as the secret word\n• Free Will → oass.app/abc/13 sends 2 inputs',
          'Ouvre cette URL sur n\'importe quel appareil — pas besoin d\'interagir avec les boutons. La webapp envoie la commande automatiquement. Exemples :\n• Multiple Out 6 textes → oass.app/abc/4 sélectionne le 4e texte\n• Choices 3 rounds (preprogrammed) → oass.app/abc/121 envoie les choix spectateur 1,2,1\n• Confab avec ((ACROSTIC_URL)) → oass.app/abc/Paris envoie "Paris" comme mot secret\n• Free Will → oass.app/abc/13 envoie 2 inputs',
          'Abre esta URL en cualquier dispositivo. La webapp envía el comando automáticamente. Ejemplos:\n• Multiple Out 6 textos → oass.app/abc/4 selecciona el 4º\n• Choices 3 rondas → oass.app/abc/121 envía 1,2,1\n• Confab con ((ACROSTIC_URL)) → oass.app/abc/Paris\n• Free Will → oass.app/abc/13')),
        Tip('warning', T(
          'Limitation: only works for presets in PREPROGRAMMED mode (1 input per round = the spectator\'s pick). Two-Inputs presets (where you also enter the performer\'s choice each round) need the standard webapp UI — the URL shortcut is ambiguous because it can\'t encode both performer + spectator picks per round.',
          'Limite : ne fonctionne que pour les presets en mode PREPROGRAMMED (1 input par round = le choix du spectateur). Les presets en Two-Inputs (où tu entres aussi le choix performer à chaque round) nécessitent l\'UI webapp standard — le raccourci URL est ambigu car il ne peut pas encoder à la fois performer + spectateur par round.',
          'Limitación: solo funciona para presets en modo PREPROGRAMMED (1 entrada por ronda). Los presets Two-Inputs requieren la UI estándar.')),
        Tip('info', T(
          'Per-preset redirect URL: in any preset editor you can set a custom redirect URL — after the assistant submits input, their browser is sent there. Empty = use the global one in Settings → Assistant. Useful for adding a thank-you page, a fake "loading" screen, or chaining to another tool.',
          'Redirection par preset : dans n\'importe quel éditeur de preset tu peux définir une URL de redirection custom — après l\'envoi de l\'input par l\'assistant, son navigateur va là. Vide = utilise la globale dans Paramètres → Assistant. Utile pour ajouter une page de remerciement, un faux écran de chargement, ou chaîner vers un autre outil.',
          'Redirección por preset: en cualquier editor puedes definir una URL custom — después del input, el navegador del asistente va ahí. Vacío = usa la global.')),
        Tip('info', T('All stealth screens: long press to exit.', 'Tous les écrans stealth : appui long pour quitter.', 'Todas las pantallas stealth: pulsación larga para salir.')),

        H(T('Decoy Mode', 'Mode Decoy', 'Modo Decoy')),
        P(T(
          'The webapp at oass.app/{id} can display a custom image (a fake page that looks like another app or document) and capture the spectator\'s taps or swipes silently. Each input is sent to the app over Firebase. After the last expected input, the page redirects somewhere of your choosing.',

    const I18N = {
      en: { sub: 'User Guide', toc: 'Table of contents', home: 'Back to oass.app',
            tipInfo: 'INFO', tipExample: 'EXAMPLE', tipWarning: 'NOTE',
            footer: 'Oracle — Mentalism Tool' },
      fr: { sub: 'Guide Utilisateur', toc: 'Sommaire', home: 'Retour à oass.app',
            tipInfo: 'INFO', tipExample: 'EXEMPLE', tipWarning: 'ATTENTION',
            footer: 'Oracle — Outil de Mentalisme' },
      es: { sub: 'Guía de Usuario', toc: 'Índice', home: 'Volver a oass.app',
            tipInfo: 'INFO', tipExample: 'EJEMPLO', tipWarning: 'NOTA',
            footer: 'Oracle — Herramienta de Mentalismo' },
    };

    let currentLang = (() => {
      const stored = localStorage.getItem('oracleTutorialLang');
      if (stored && ['en','fr','es'].includes(stored)) return stored;
      const browser = (navigator.language || 'en').slice(0,2);
      return ['fr','es'].includes(browser) ? browser : 'en';
    })();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
      }[c]));
    }

    function render() {
      const lang = currentLang;
      document.documentElement.lang = lang;
      document.getElementById('brandSub').textContent = I18N[lang].sub;
      document.getElementById('footerText').innerHTML =
        I18N[lang].footer + ' · <a href="/">' + I18N[lang].home + '</a>';

      // Lang switcher state
      document.querySelectorAll('.lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });

      // TOC
      const toc = document.getElementById('toc');
      toc.innerHTML = '<div class="toc-title">' + I18N[lang].toc + '</div>'
        + SECTIONS.map(s => '<a href="#' + s.id + '">' + escapeHtml(t(s.title, lang)) + '</a>').join('');

      // Sections
      const content = document.getElementById('content');
      content.innerHTML = SECTIONS.map(s => {
        const items = s.items.map(it => {
          if (it.kind === 'h')   return '<div class="h">' + escapeHtml(t(it.title, lang)) + '</div>';
          if (it.kind === 'p')   return '<div class="p">' + escapeHtml(t(it.text, lang)) + '</div>';
          if (it.kind === 'tip') {
            const label = it.type === 'info' ? I18N[lang].tipInfo
                        : it.type === 'example' ? I18N[lang].tipExample
                        : I18N[lang].tipWarning;
            return '<div class="tip ' + it.type + '">'
                 + '<span class="tip-label">' + label + '</span>'
                 + escapeHtml(t(it.text, lang)) + '</div>';
          }
          if (it.kind === 'table') {
            const rows = it.rows.map((r, i) => {
              const cells = r.map(cell => {
                const cellText = escapeHtml(t(cell, lang));
                return i === 0 ? '<th>' + cellText + '</th>' : '<td>' + cellText + '</td>';
              }).join('');
              return '<tr>' + cells + '</tr>';
            }).join('');
            return '<table>' + rows + '</table>';
          }
          return '';
        }).join('');
        return '<section class="section" id="' + s.id + '">'
             + '<h2 class="section-title">' + escapeHtml(t(s.title, lang)) + '</h2>'
             + items + '</section>';
      }).join('');
    }

    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.addEventListener('click', () => {
        currentLang = b.dataset.lang;
        localStorage.setItem('oracleTutorialLang', currentLang);
        render();
      });
    });

    render();
  </script>
